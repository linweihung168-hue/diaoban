<!DOCTYPE html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>調班表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="調班表">
<meta name="application-name" content="調班表">
<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--bd:#d9dde5;--ac:#1f6feb;--mut:#6b7385;--ok:#17803d;--warn:#b45309;--danger:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8ebf2;--card:#1d222b;--bd:#323946;--ac:#5b9dff;--mut:#98a1b3;--ok:#4cc27a;--warn:#f0b35a}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 10px}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input,select{height:44px;line-height:1.2}
input[type=date],input[type=time],input[type=month]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.row>div{min-width:0}
button.go{background:var(--ac);color:#fff;border:0;margin-top:14px;font-weight:600}
button.x{width:auto;padding:4px 10px;height:auto;background:transparent;color:var(--fg)}
button:disabled{opacity:.4}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}.seg button{height:44px;padding:6px}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.calc{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}th{color:var(--mut)}
td input{width:84px;height:36px;padding:4px 8px}td input.auto{color:var(--mut)}
details summary{cursor:pointer;font-weight:600}details[open]>summary{margin-bottom:8px}
.ec{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px;line-height:1.7}.ec summary{font-weight:600;margin:0!important}
.ec .bt{display:flex;gap:8px;margin-top:6px}.ec .bt button{border:1px solid var(--bd)}
.big{font-size:22px;font-weight:700}
.mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:16px}
.mask>.card{max-width:440px;width:100%;margin:0;max-height:92%;overflow:auto}
#toast{display:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:40}
#bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:18px}
.ic{width:18px;height:18px;vertical-align:middle}
</style></head><body><main>

<section id="login" class="card" style="display:none"><h1>調班表</h1>
<label>員工代號</label><input id="code" inputmode="numeric" autocomplete="off">
<p class="warn" id="lerr" style="min-height:1.4em;margin:6px 0 0"></p><button type="button" class="go" id="lgin" style="margin-top:6px">登入</button></section>

<div id="app" style="display:none">
<div id="bar"><b id="who"></b><button type="button" id="out" class="x">登出</button></div>
<div id="tabs" class="row" style="margin-bottom:14px;display:none"><button type="button" id="tabP">D2694</button><button type="button" id="tabB">後台管理</button></div>

<section id="fill">
<div id="pbtns" class="seg" style="margin-bottom:14px;display:none"></div>
<div class="card">
<div class="row"><div><label>日期</label><input type="date" id="d"></div>
<div><label>類型</label><select id="ty"><option value="OT">加班</option><option value="LV">請假</option><option value="OTH">其他</option></select></div></div>
<div id="shW"><label>班別</label><select id="s"></select></div>
<div id="lvk" style="display:none"><label>請假種類</label><div class="seg"><button type="button" data-k="AM">AM</button><button type="button" data-k="PM">PM</button><button type="button" data-k="LV">小時假</button><button type="button" data-k="DAY">整天</button></div></div>
<div class="row" id="ab"><div id="aW"><label id="aL">原下班時間</label><input id="a" inputmode="numeric" maxlength="5" autocomplete="off"></div><div><label id="bL">實際下班時間</label><input id="b" inputmode="numeric" maxlength="5" autocomplete="off"></div></div>
<div class="row" id="dk"><div><label>醫師</label><select id="doc"></select></div><div><label>最後一張領藥號</label><input id="k" autocomplete="off" placeholder="紙本請留存"></div></div>
<label id="nL">備註（選填）</label><input id="nt" maxlength="200" autocomplete="off">
<div class="calc" id="c" style="display:none"></div>
<button type="button" class="go" id="go">送出</button></div>
<div class="card"><h2 id="mineH">我的未休分鐘</h2><div id="mine"></div></div>
<div class="card"><details><summary>本月登記查詢</summary><div id="myList"></div></details></div>
<div class="card"><details><summary>本月每日明細</summary><div class="scroll"><table id="myDays"></table></div></details></div>
</section>

<section id="back" style="display:none">
<div class="card"><label style="margin-top:0">月份</label><input type="month" id="bm"></div>
<div class="card"><h2>匯出</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><select id="xr"><option value="m">只匯出所選月份</option><option value="all">全部資料</option></select><button type="button" class="go" id="xgo" style="margin:0">下載 Excel</button></div><p class="note" style="margin:8px 0 0">內容：每日彙總、所有登記、月結、已刪除、修改紀錄、登入紀錄</p></div>
<div class="card"><h2>每日彙總</h2><div id="dpb" class="seg" style="margin-bottom:10px"></div><div class="scroll"><table id="bDays"></table></div></div>
<div class="card"><h2>需人工核對</h2><div class="scroll"><table id="bMan"></table></div></div>
<div class="card"><h2>月結</h2><div class="scroll"><table id="bStat"></table></div></div>
<div class="card"><details id="dAll"><summary>所有登記</summary>
<div class="row" style="margin-top:8px"><div><label>人員</label><select id="fp"></select></div><div><label>類型</label><select id="ft"><option value="">全部</option><option value="OT">加班</option><option value="AM">請假/AM</option><option value="PM">請假/PM</option><option value="LV">小時假</option><option value="DAY">請假/整天</option><option value="OTH">其他</option></select></div></div>
<p class="note" id="fcnt" style="margin:8px 0"></p><div id="bList"></div></details></div>
<div class="card"><details id="dTrash"><summary>已刪除</summary><div class="scroll"><table id="bTrash"></table></div></details></div>
<div class="card"><details id="dEdits"><summary>修改紀錄</summary><div class="scroll"><table id="bEdits"></table></div></details></div>
<div class="card"><details id="dLogins"><summary>登入紀錄</summary>
<p><button type="button" id="clrLog" class="x" title="清空登入紀錄" aria-label="清空登入紀錄" style="border:1px solid var(--bd)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button></p>
<div class="scroll"><table id="bLogins"></table></div></details></div>
</section>
</div>
<p class="note" style="text-align:center;margin:18px 0 6px"><a href="manual.html" target="_blank" rel="noopener" style="color:var(--mut)">使用說明</a></p>
</main>

<div id="toast">已送出</div>
<div id="gm" class="mask"><div class="card"><h2 id="gt"></h2><div id="gb" style="font-size:14px;line-height:1.7"></div><div class="row" id="gbtn" style="margin-top:12px"></div></div></div>
<div id="em" class="mask"><div class="card"><h2>編輯登記</h2><p class="note" id="einfo"></p>
<div class="row"><div><label>日期</label><input type="date" id="ed"></div><div><label>班別</label><select id="es"></select></div></div>
<div class="row" id="eab"><div><label>開始／原下班時間</label><input id="ea" inputmode="numeric" maxlength="5"></div><div><label>結束時間</label><input id="eb" inputmode="numeric" maxlength="5"></div></div>
<div class="row" id="edk"><div><label>醫師</label><select id="edoc"></select></div><div><label>最後一張領藥號</label><input id="ek"></div></div>
<label>備註</label><input id="ent" maxlength="200">
<div class="row" style="margin-top:12px"><button type="button" id="ecancel">取消</button><button type="button" class="go" id="esave" style="margin:0">儲存修改</button></div></div></div>
<div id="lockm" class="mask" style="z-index:50"><div class="card"><h2>已鎖定</h2><p class="note">閒置時間較長，請輸入員工代號繼續使用。</p>
<input id="lcode" inputmode="numeric" autocomplete="off"><p class="warn" id="lerr2" style="min-height:1.4em;margin:6px 0 0"></p><button type="button" class="go" id="lgo" style="margin-top:6px">繼續</button></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TY={OT:'加班',AM:'請假/AM',PM:'請假/PM',LV:'小時假',DAY:'請假/整天',OTH:'其他'};
const touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0;
const store=(()=>{try{const s=touch?localStorage:sessionStorage;s.getItem('x');return s}catch(e){const m={};return{getItem:k=>m[k]||null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}}}})(), TK='diaoban_tok';
const ymNow=()=>{const t=new Date(Date.now()+8*36e5).toISOString();return t.slice(0,7)};
const dayNow=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,10);
let S={token:null,me:null,cfg:null,tab:'fill',target:'',month:ymNow(),lk:null,fv:null,bv:null,dp:'',lockAt:Date.now()};
const V=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x||'');
const tm=x=>{const p=String(x).split(':');return +p[0]*60+ +p[1]};
const half=m=>Math.floor(m/30)/2;
const hm=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'h':'')+(r||!h?r+'m':'')};
const fm=n=>Math.round(n*100)/100;
const dev=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows 電腦':/Mac/.test(u)?'Mac':'其他裝置'};
const dn=n=>String(n).replace(/醫師/g,'');   // 顯示用：班別名稱裡的「醫師」不顯示（資料裡的名稱不變）
const shiftOf=n=>(S.cfg?S.cfg.shifts:[]).find(s=>s.name===n);
const isAdmin=()=>S.me&&S.me.role==='管理者';

/* ---- 與後端溝通 ---- */
const API='https://moljaswicnyuapldqvfz.supabase.co/functions/v1/api';   // ← 部署時只要改這一行（見部署說明）
async function rpc(action,token,payload){
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:action,token:token,payload:payload||{}})});r=await r.json()}
  catch(e){throw new Error('連線失敗，請檢查網路後再試')}
  return r;
}
async function call(action,payload){
  const r=await rpc(action,S.token,payload);
  if(r&&r.ok===false){if(r.error==='AUTH'){lostAuth();throw new Error('登入已失效，請重新登入')}throw new Error(r.error)}
  return r;
}
/* ---- 小視窗 ---- */
function modal(title,body,btns){return new Promise(res=>{$('gt').textContent=title;$('gb').innerHTML=body;const w=$('gbtn');w.innerHTML='';
  btns.forEach(b=>{const e=document.createElement('button');e.type='button';e.textContent=b.t;if(b.go){e.className='go';e.style.margin='0';if(b.danger)e.style.background='var(--danger)'}e.onclick=()=>{$('gm').style.display='none';res(b.v)};w.appendChild(e)});
  w.style.gridTemplateColumns=btns.length===1?'1fr':'1fr 1fr';$('gm').style.display='flex'});}
const msg=t=>modal('提醒','<p style="margin:0">'+esc(t)+'</p>',[{t:'好',v:true,go:true}]);
const ask=(title,body,ok,danger)=>modal(title,body,[{t:'取消',v:false},{t:ok,v:true,go:true,danger}]);
let tt;const toast=m=>{const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2500)};

/* ---- 登入 ---- */
function showLogin(m){$('app').style.display='none';$('login').style.display='';$('lerr').textContent=m||'';$('code').value='';S.token=null;S.me=null}
function lostAuth(){store.removeItem(TK);showLogin('登入已失效，請重新輸入員工代號')}
async function doLogin(code,unlock){return call0('login',{code:code,dev:dev(),unlock:!!unlock})}
async function call0(a,p){const r=await rpc(a,null,p);if(r&&r.ok)return r;throw new Error((r&&r.error)||'登入失敗')}
async function afterLogin(r){S.token=r.token;S.me=r.me;S.cfg=r.cfg;store.setItem(TK,r.token);S.tab='fill';S.target='';S.lk=null;S.month=ymNow();S.last=r.last;S.pre=r.view||null;enter()}
$('lgin').onclick=async()=>{const c=$('code').value.trim();if(!c){$('lerr').textContent='請輸入員工代號';return}
  $('lgin').disabled=true;try{await afterLogin(await doLogin(c))}catch(e){$('lerr').textContent=e.message}$('lgin').disabled=false};
$('code').onkeydown=e=>{if(e.key==='Enter')$('lgin').click()};
$('out').onclick=()=>{store.removeItem(TK);showLogin('')};
async function boot(){
  const t=store.getItem(TK);
  if(t){S.token=t;try{const r=await call('init');S.me=r.me;S.cfg=r.cfg;S.last=null;S.pre=r.view||null;enter();return}catch(e){store.removeItem(TK)}}
  showLogin('');
}
function enter(){
  $('login').style.display='none';$('app').style.display='';$('who').textContent=S.me.name;
  $('tabs').style.display=isAdmin()?'':'none';
  initForm();fillPeople();switchTab(isAdmin()?'back':S.tab);
}
function fillPeople(){
  const names=S.cfg.staff;
  $('pbtns').innerHTML=names.map(n=>`<button type="button" data-p="${esc(n)}">${esc(n)}</button>`).join('');
  $('dpb').innerHTML=['全部'].concat(names).map(n=>`<button type="button" data-dp="${n==='全部'?'':esc(n)}">${esc(n)}</button>`).join('');
  $('fp').innerHTML='<option value="">全部</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
}
function switchTab(t){
  S.tab=t;const adm=isAdmin();
  $('fill').style.display=(t==='fill')?'':'none';$('back').style.display=(t==='back'&&adm)?'':'none';
  $('pbtns').style.display=(adm&&t==='fill')?'':'none';
  $('tabP').className=t==='fill'?'go':'';$('tabP').style.margin='0';$('tabB').className=t==='back'?'go':'';$('tabB').style.margin='0';
  if(t==='fill')loadFill();else loadBack();
}
$('tabP').onclick=()=>switchTab('fill');$('tabB').onclick=()=>switchTab('back');

/* ---- 填寫表單 ---- */
function initForm(){
  $('s').innerHTML=S.cfg.shifts.map(s=>`<option value="${esc(s.name)}">${esc(dn(s.name))}</option>`).join('');
  $('doc').innerHTML='<option value="">請選擇</option>'+S.cfg.doctors.map(n=>`<option>${esc(n)}</option>`).join('');
  $('d').value=dayNow();$('ty').value='OT';S.lk=null;$('nt').value='';$('k').value='';onForm(true);
}
const effTy=()=>{const v=$('ty').value;return v==='LV'?(S.lk||''):v};
function fmt(el){let v=el.value.replace(/\D/g,'').slice(0,4);if(v.length>2)v=v.slice(0,2)+':'+v.slice(2);el.value=v}
function onForm(reset){
  const sel=$('ty').value, sh=shiftOf($('s').value)||{}, np=sh.type==='N+';
  const noHalf=!!(sh.night||String(sh.name||'').indexOf('週六')===0);
  if(S.lk&&(S.lk==='AM'||S.lk==='PM')&&noHalf)S.lk=null;
  document.querySelectorAll('#lvk button').forEach(b=>{const k=b.dataset.k;b.disabled=(k==='AM'||k==='PM')&&noHalf;b.classList.toggle('on',S.lk===k)});
  const t=effTy();
  $('lvk').style.display=sel==='LV'?'':'none';
  $('shW').style.display=sel==='OTH'?'none':'';
  const needTimes=(t==='OT'||t==='LV'||sel==='OTH');
  $('ab').style.display=needTimes?'':'none';
  $('aW').style.display=(t==='OT'&&np)?'none':'';
  $('aL').textContent=t==='LV'?'請假開始':sel==='OTH'?'開始（選填）':'原下班時間';
  $('bL').textContent=t==='LV'?'請假結束':sel==='OTH'?'結束（選填）':np?'下班時間':'實際下班時間';
  $('dk').style.display=t==='OT'?'':'none';
  const D=$('doc');if(t==='OT'&&sh.doctor){D.value=sh.doctor;D.disabled=true}else{if(D.disabled)D.value='';D.disabled=false}
  $('nL').textContent=sel==='OTH'?'備註（必填）':'備註（選填）';
  if(reset){$('a').value=(t==='OT'&&!np)?(sh.end||''):'';$('b').value=t==='LV'?(sh.end||''):''}
  calc();
}
function overlap(sh,a,b){return (sh.windows||[]).some(w=>tm(a)<tm(w[1])&&tm(b)>tm(w[0]))}
function readForm(){return{date:$('d').value,shift:$('ty').value==='OTH'?'—':$('s').value,a:$('a').value.trim(),b:$('b').value.trim(),doc:$('doc').value,k:$('k').value.trim().toUpperCase(),note:$('nt').value.trim()}}
function chk(t,o){
  const sh=shiftOf(o.shift)||{},np=sh.type==='N+',miss=[];
  if(!o.date)miss.push('日期');
  if(t==='OT'){if(!o.b)miss.push(np?'下班時間':'實際下班時間');if(!np&&!o.a)miss.push('原下班時間');if(!o.doc)miss.push('醫師');if(!o.k)miss.push('最後一張領藥號')}
  if(t==='LV'){if(!o.a)miss.push('請假開始');if(!o.b)miss.push('請假結束')}
  if(t==='OTH'&&!o.note)miss.push('備註');
  if(miss.length)return '請先填寫：'+miss.join('、');
  if(o.date>dayNow())return '不能登記未來的日期';
  if((t==='OT'||t==='LV')&&(!V(o.b)||(!(np&&t==='OT')&&!V(o.a))))return '時間請用 24 小時制，例如 17:30、21:30';
  if(t==='OT'&&!(/[A-Z]/.test(o.k)&&/\d/.test(o.k)&&/^[A-Z0-9\-]+$/.test(o.k)))return '最後一張領藥號請填英文字母加數字，例如 K162';
  if(t==='OT'){if(np){if(tm(o.b)<690)return '下班時間要在 11:30 之後'}else{if(tm(o.b)<=tm(o.a))return '實際下班要晚於原下班時間';if(overlap(sh,o.a,o.b))return '這段時間橫跨正常上班時段，請分成兩筆填寫（例如：中午一筆、下午一筆）。'}}
  if(t==='LV'){if(np)return '週六 N+ 請假請用「其他」並寫備註';if(tm(o.b)<=tm(o.a))return '請假結束要晚於請假開始'}
  return '';
}
function calc(){
  const t=effTy(),o=readForm(),sh=shiftOf(o.shift)||{},np=sh.type==='N+',el=$('c');let h='';
  if(t==='OT'&&V(o.b)&&(np||V(o.a))){const m=np?150+tm(o.b)-690:tm(o.b)-tm(o.a);if(np){if(tm(o.b)>=690)h='上班時段合計 <b>'+hm(m)+'</b> → 計入 <b>'+half(m)+'h</b>，多出 '+m%30+' 分'}else if(m>0)h='這筆加班 <b>'+hm(m)+'</b>'}

function whenOf(e){return e.ty==='OT'?(shiftOf(e.shift)&&shiftOf(e.shift).type==='N+'?'至 '+e.b:e.a+'–'+e.b):e.ty==='LV'?e.a+'–'+e.b+'（'+hm(tm(e.b)-tm(e.a))+'）':e.ty==='AM'?'14:00 上班':e.ty==='PM'?'12:30 下班':e.ty==='DAY'?'整天':(e.a?e.a+'–'+e.b:'')}
function entryCard(e,adm){
  const mark=adm&&e.proxy?`<span class="warn">（由${esc(e.proxy)}代填）</span>`:'', ed=e.edited?`<span class="warn">（${adm?'已修改':'管理者已修改'}）</span>`:'';
  return `<details class="ec"><summary>${esc(e.date.slice(5))}　${adm?esc(e.name)+'　':''}${TY[e.ty]}${whenOf(e)?'　'+esc(whenOf(e)):''}</summary>${e.shift!=='—'?esc(dn(e.shift))+'<br>':''}${e.doc?esc(e.doc)+(e.k?'　'+esc(e.k):'')+'<br>':''}${e.note?'備註：'+esc(e.note)+'<br>':''}${mark}${ed}${adm?`<div class="bt"><button type="button" data-act="edit" data-id="${esc(e.id)}">編輯</button><button type="button" data-act="del" data-id="${esc(e.id)}">刪除</button></div>`:''}</details>`;
}
function daysTable(days,adm){
  let h=`<tr><th>日期</th>${adm?'<th>姓名</th>':''}<th>班別</th><th>總工時</th><th>多出分鐘</th><th>計入工時</th><th>分鐘</th><th>請假</th>${adm?'<th>班別代號</th><th>小夜h</th>':''}<th>備註</th></tr>`;
  days.slice().sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:0).forEach(d=>{const note=[d.ty?esc(d.ty):'',d.notes.length?'<span class="warn">需人工核對：'+esc(d.notes.join('；'))+'</span>':'',d.warn?'<span class="warn">'+esc(d.warn)+'</span>':''].filter(Boolean).join('　');
    h+=`<tr><td>${esc(d.date)}</td>${adm?'<td>'+esc(d.name)+'</td>':''}<td>${esc(dn(d.shift))}</td><td><b>${d.total==null?'—':fm(d.total)+' h'}</b></td><td>${d.extra?'<span class="warn">'+d.extra+' 分</span>':'0'}</td><td>${d.counted} h</td><td>${d.t}</td><td>${d.lv?hm(d.lv):''}</td>${adm?'<td>'+(d.bcode||'')+'</td><td>'+(d.nightH||'')+'</td>':''}<td>${note}</td></tr>`});

}

$('xgo').onclick=async()=>{
  const btn=$('xgo');btn.disabled=true;btn.textContent='準備中…';

    const [r]=await Promise.all([call('export'),loadXlsx()]);
    const ym=S.month,all=$('xr').value==='all',inM=s=>all||String(s).slice(0,7)===ym;
    const tyOf=t=>TY[t]||t;
    const timeOf=(ty,sh,a,b)=>{const s=shiftOf(sh);return ty==='OT'?(s&&s.type==='N+'?'至 '+b:a+'–'+b):ty==='LV'?a+'–'+b:ty==='AM'?'14:00 上班':ty==='PM'?'12:30 下班':ty==='DAY'?'整天':(a?a+'–'+b:'')};
    const days=[['日期','姓名','班別','總工時(h)','多出分鐘','計入工時(h)','加班分鐘','請假','班別代號','小夜h','備註']].concat(r.days.filter(d=>inM(d.date)).map(d=>[d.date,d.name,d.shift,d.total==null?'':d.total,d.extra,d.counted,d.t,d.lv?hm(d.lv):'',d.bcode||'',d.nightH||'',[d.ty,d.notes.length?'需人工核對：'+d.notes.join('；'):'',d.warn].filter(Boolean).join('　')]));

    const stat=[['年月','姓名','上月未休分鐘','本月總加班分鐘','本月多出分鐘','未休分鐘(含上月)','可換算(h)','本月抵消(h)','結轉下月(分)']].concat(r.stats.filter(s=>inM(s.ym)).map(s=>[s.ym,s.name,s.carryIn,s.total,s.extra,s.unused,s.can,s.offset,s.carryOut]));
    const del=[['刪除時間','刪除者','對象','日期','類型','班別','時間','醫師','最後一張領藥號','備註']].concat(r.deleted.filter(e=>inM(e[4])).map(e=>[e[14],e[15],e[3],e[4],tyOf(e[5]),e[6]==='—'?'':e[6],timeOf(e[5],e[6],e[7],e[8]),e[9],e[10],e[11]]));
    const edt=[['時間','修改者','動作','對象','修改前','修改後']].concat(r.edits.filter(e=>inM(e[0])));
    const lgn=[['時間','姓名','裝置']].concat(r.logins.filter(e=>inM(e[0])));

    [['每日彙總',days],['所有登記',ents],['月結',stat],['已刪除',del],['修改紀錄',edt],['登入紀錄',lgn]].forEach(([n,rows])=>{
      const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((_,i)=>({wch:Math.min(40,Math.max(8,...rows.slice(0,60).map(x=>String(x[i]==null?'':x[i]).length*1.6)))}));
