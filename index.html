<!DOCTYPE html>
<html lang="zh-Hant"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>調班表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="調班表">

<style>
:root{--bg:#f6f7f9;--fg:#1d2330;--card:#fff;--bd:#d9dde5;--ac:#1f6feb;--mut:#6b7385;--ok:#17803d;--warn:#b45309;--danger:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--fg:#e8ebf2;--card:#1d222b;--bd:#323946;--ac:#5b9dff;--mut:#98a1b3;--ok:#4cc27a;--warn:#f0b35a}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}h1{font-size:20px;margin:4px 0 10px}h2{font-size:16px;margin:0 0 10px}
.note{color:var(--mut);font-size:13px;margin:0 0 10px}.warn{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea,button{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
input,select{height:44px;line-height:1.2}
input[type=date],input[type=time],input[type=month]{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.row>div{min-width:0}
button.go{background:var(--ac);color:#fff;border:0;margin-top:14px;font-weight:600}
button.x{width:auto;padding:4px 10px;height:auto;background:transparent;color:var(--fg)}
button:disabled{opacity:.4}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}.seg button{height:44px;padding:6px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.mnav button{width:48px;height:44px;font-size:22px;padding:0}.mnav span{font-weight:600;font-size:17px}
.chips{display:flex;gap:8px}.chips button{width:auto;flex:0 0 auto;height:auto;padding:4px 16px;border-radius:99px;font-size:13px}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.seg button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.calc{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg);font-size:14px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left}th{color:var(--mut)}
td input{width:84px;height:36px;padding:4px 8px}td input.auto{color:var(--mut)}
details summary{cursor:pointer;font-weight:600}details[open]>summary{margin-bottom:8px}
.ec{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px;line-height:1.7}.ec summary{font-weight:600;margin:0!important}
.ec .bt{display:flex;gap:8px;margin-top:6px}.ec .bt button{border:1px solid var(--bd)}
.big{font-size:22px;font-weight:700}
.mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:20;align-items:center;justify-content:center;padding:16px}
.mask>.card{max-width:440px;width:100%;margin:0;max-height:92%;overflow:auto}
#toast{display:none;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;z-index:40}
#bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:18px}
.ic{width:18px;height:18px;vertical-align:middle}
</style></head><body><main>

<div id="dk"><label>醫師</label><select id="doc"></select><div class="row"><div><label>最後一張領藥號</label><input id="k" autocomplete="off"></div><div><label>處方時間</label><input id="kt" inputmode="numeric" maxlength="5" autocomplete="off"></div></div><p class="note" style="margin:6px 0 0">處方簽上的號碼與時間，紙本請留存</p></div>

<div class="card"><h2>需人工核對</h2><div class="scroll"><table id="bMan"></table></div></div>
<div class="card"><h2>月結</h2><div class="scroll"><table id="bStat"></table></div></div>

<div class="row" style="margin-top:8px"><div><label>人員</label><select id="fp"></select></div><div><label>類型</label><select id="ft"><option value="">全部</option><option value="OT">加班</option><option value="AM">請假/AM</option><option value="PM">請假/PM</option><option value="LV">小時假</option><option value="DAY">請假/整天</option><option value="OTH">其他</option></select></div></div>

<div class="card"><details id="dLogins"><summary>登入紀錄</summary>
<p><button type="button" id="clrLog" class="x" title="清空登入紀錄" aria-label="清空登入紀錄" style="border:1px solid var(--bd)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg></button></p>
<div class="scroll"><table id="bLogins"></table></div></details></div>
</section>

<section id="fill90" style="display:none">
<div class="card"><div id="f9body"></div><button type="button" class="go" id="go9">送出</button></div>
<div class="card" id="c9mine"><h2>我的未休分鐘（含上月）</h2><div id="mine9"></div></div>
<div class="card" id="c9list"><details><summary>本月登記查詢</summary><div id="list9"></div></details></div>

<section id="back90" style="display:none">

<div class="card"><h2>匯出</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><select id="xr9"><option value="m">只匯出所選月份</option><option value="all">全部資料</option></select><button type="button" class="go" id="xgo9" style="margin:0">下載 Excel</button></div><p class="note" style="margin:8px 0 0">內容：班表變動、請假、加班、所有登記、每人彙總、已刪除、修改紀錄</p></div>
<div class="card"><details id="dAll9"><summary>所有登記</summary>
<div class="row" style="margin-top:8px"><div><label>人員</label><select id="fp9"></select></div><div><label>類型</label><select id="ft9"><option value="">全部</option><option>換班</option><option>請假</option><option>加班</option><option>其他</option></select></div></div>
<p class="note" id="fcnt9" style="margin:8px 0"></p><div id="bList9"></div></details></div>

</main>

<div id="toast">已送出</div>
<div id="gm" class="mask"><div class="card"><h2 id="gt"></h2><div id="gb" style="font-size:14px;line-height:1.7"></div><div class="row" id="gbtn" style="margin-top:12px"></div></div></div>
<div id="em" class="mask"><div class="card"><h2>編輯登記</h2><p class="note" id="einfo"></p>
<div class="row"><div><label>日期</label><input type="date" id="ed"></div><div><label>班別</label><select id="es"></select></div></div>
<div class="row" id="eab"><div><label>開始／原下班時間</label><input id="ea" inputmode="numeric" maxlength="5"></div><div><label>結束時間</label><input id="eb" inputmode="numeric" maxlength="5"></div></div>
<div id="edk"><label>醫師</label><select id="edoc"></select><div class="row"><div><label>最後一張領藥號</label><input id="ek"></div><div><label>處方時間</label><input id="ekt" inputmode="numeric" maxlength="5"></div></div></div>
<label>備註</label><input id="ent" maxlength="200">
<div class="row" style="margin-top:12px"><button type="button" id="ecancel">取消</button><button type="button" class="go" id="esave" style="margin:0">儲存修改</button></div></div></div>
<div id="em9" class="mask"><div class="card"><h2>編輯登記</h2><p class="note" id="einfo9"></p><div id="e9body"></div>
<div class="row" style="margin-top:12px"><button type="button" id="ecancel9">取消</button><button type="button" class="go" id="esave9" style="margin:0">儲存修改</button></div></div></div>
<div id="lockm" class="mask" style="z-index:50"><div class="card"><h2>已鎖定</h2><p class="note">閒置時間較長，請輸入員工代號繼續使用。</p>
<input id="lcode" inputmode="numeric" autocomplete="off"><p class="warn" id="lerr2" style="min-height:1.4em;margin:6px 0 0"></p><button type="button" class="go" id="lgo" style="margin-top:6px">繼續</button></div></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TY={OT:'加班',AM:'請假/AM',PM:'請假/PM',LV:'小時假',DAY:'請假/整天',OTH:'其他'};
const touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||navigator.maxTouchPoints>0;
const store=(()=>{try{const s=touch?localStorage:sessionStorage;s.getItem('x');return s}catch(e){const m={};return{getItem:k=>m[k]||null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}}}})(), TK='diaoban_tok';
const ymNow=()=>{const t=new Date(Date.now()+8*36e5).toISOString();return t.slice(0,7)};
const dayNow=()=>new Date(Date.now()+8*36e5).toISOString().slice(0,10);
let S={token:null,me:null,cfg:null,tab:'fill',target:'',month:ymNow(),lk:null,fv:null,bv:null,dp:'',lockAt:Date.now()};
const V=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x||'');
const tm=x=>{const p=String(x).split(':');return +p[0]*60+ +p[1]};
const half=m=>Math.floor(m/30)/2;
const hm=m=>{const h=Math.floor(m/60),r=m%60;return (h?h+'h':'')+(r||!h?r+'m':'')};
const fm=n=>Math.round(n*100)/100;
const dev=()=>{const u=navigator.userAgent;return /iPhone|iPad/.test(u)?'iPhone/iPad':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows 電腦':/Mac/.test(u)?'Mac':'其他裝置'};
const dn=n=>String(n).replace(/醫師/g,'');   // 顯示用：班別名稱裡的「醫師」不顯示（資料裡的名稱不變）
const shiftOf=n=>(S.cfg?S.cfg.shifts:[]).find(s=>s.name===n);
const isAdmin=()=>S.me&&S.me.role==='管理者';
const isD90=x=>/^D2690/.test(x[4]||'')||/^D2690/.test(x[5]||'');

/* ---- 與後端溝通 ---- */
const API='https://moljaswicnyuapldqvfz.supabase.co/functions/v1/api';   // ← 部署時只要改這一行（見部署說明）
async function rpc(action,token,payload){
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:action,token:token,payload:payload||{}})});r=await r.json()}
  catch(e){throw new Error('連線失敗，請檢查網路後再試')}
  return r;
}
async function call(action,payload){
  const r=await rpc(action,S.token,payload);
  if(r&&r.ok===false){if(r.error==='AUTH'){lostAuth();throw new Error('登入已失效，請重新登入')}throw new Error(r.error)}
  return r;
}
/* ---- 小視窗 ---- */
function modal(title,body,btns){return new Promise(res=>{$('gt').textContent=title;$('gb').innerHTML=body;const w=$('gbtn');w.innerHTML='';
  btns.forEach(b=>{const e=document.createElement('button');e.type='button';e.textContent=b.t;if(b.go){e.className='go';e.style.margin='0';if(b.danger)e.style.background='var(--danger)'}e.onclick=()=>{$('gm').style.display='none';res(b.v)};w.appendChild(e)});
  w.style.gridTemplateColumns=btns.length===1?'1fr':'1fr 1fr';$('gm').style.display='flex'});}
const msg=t=>modal('提醒','<p style="margin:0">'+esc(t)+'</p>',[{t:'好',v:true,go:true}]);
const ask=(title,body,ok,danger)=>modal(title,body,[{t:'取消',v:false},{t:ok,v:true,go:true,danger}]);
let tt;const toast=m=>{const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2500)};

/* ---- 登入 ---- */
function showLogin(m){$('app').style.display='none';$('login').style.display='';$('lerr').textContent=m||'';$('code').value='';S.token=null;S.me=null}
function lostAuth(){store.removeItem(TK);showLogin('登入已失效，請重新輸入員工代號')}
async function doLogin(code,unlock){return call0('login',{code:code,dev:dev(),unlock:!!unlock})}
async function call0(a,p){const r=await rpc(a,null,p);if(r&&r.ok)return r;throw new Error((r&&r.error)||'登入失敗')}
async function afterLogin(r){S.token=r.token;S.me=r.me;S.cfg=r.cfg;store.setItem(TK,r.token);S.tab='fill';S.target='';S.lk=null;S.month=ymNow();S.last=r.last;S.pre=r.view||null;S.cfg90=r.cfg90||null;enter()}
$('lgin').onclick=async()=>{const c=$('code').value.trim();if(!c){$('lerr').textContent='請輸入員工代號';return}
  $('lgin').disabled=true;try{await afterLogin(await doLogin(c))}catch(e){$('lerr').textContent=e.message}$('lgin').disabled=false};
$('code').onkeydown=e=>{if(e.key==='Enter')$('lgin').click()};
$('out').onclick=()=>{store.removeItem(TK);showLogin('')};
async function boot(){
  const t=store.getItem(TK);
  if(t){S.token=t;try{const r=await call('init');S.me=r.me;S.cfg=r.cfg;S.cfg90=r.cfg90||null;S.last=null;S.pre=r.view||null;enter();return}catch(e){store.removeItem(TK)}}
  showLogin('');
}
const myUnits=()=>((S.me&&S.me.units&&S.me.units.length)?S.me.units:['D2694']).filter(u=>u!=='D2690'||S.cfg90);
function enter(){
  $('login').style.display='none';$('app').style.display='';$('who').textContent=S.me.name;
  $('tabs').style.display=isAdmin()?'':'none';
  const us=myUnits();let u=null;try{u=store.getItem('diaoban_unit')}catch(e){}
  S.unit=us.indexOf(u)>=0?u:(us.indexOf('D2694')>=0?'D2694':us[0]);
  $('units').style.display=us.length>1?'':'none';
  $('units').innerHTML=['D2690','D2694'].filter(x=>us.indexOf(x)>=0).map(x=>`<button type="button" data-u="${x}">${x}</button>`).join('');
  initForm();fillPeople();if(S.cfg90)initForm9();switchTab(isAdmin()?'back':S.tab);
}
$('units').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.u===S.unit)return;S.unit=b.dataset.u;try{store.setItem('diaoban_unit',S.unit)}catch(er){}switchTab(S.tab)};
function fillPeople(){
  const names=S.cfg.staff;
  $('pbtns').innerHTML=names.map(n=>`<button type="button" data-p="${esc(n)}">${esc(n)}</button>`).join('');
  $('dpb').innerHTML=['全部'].concat(names).map(n=>`<button type="button" data-dp="${n==='全部'?'':esc(n)}">${esc(n)}</button>`).join('');
  $('fp').innerHTML='<option value="">全部</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');
}
function switchTab(t){
  S.tab=t;const adm=isAdmin(),u=S.unit;
  document.querySelectorAll('#units button').forEach(b=>b.className=b.dataset.u===u?'on':'');
  $('fill').style.display=(t==='fill'&&u==='D2694')?'':'none';$('back').style.display=(t==='back'&&adm&&u==='D2694')?'':'none';
  $('fill90').style.display=(t==='fill'&&u==='D2690')?'':'none';$('back90').style.display=(t==='back'&&adm&&u==='D2690')?'':'none';
  $('pbtns').style.display=(adm&&t==='fill'&&u==='D2694')?'':'none';
  $('tabP').className=t==='fill'?'go':'';$('tabP').style.margin='0';$('tabB').className=t==='back'?'go':'';$('tabB').style.margin='0';
  if(u==='D2690'){if(t==='fill')loadFill90();else loadBack90();return}
  if(t==='fill')loadFill();else loadBack();
}

function chk(t,o){
  const sh=shiftOf(o.shift)||{},np=sh.type==='N+',miss=[];

  if(t==='LV'){if(np)return '週六 N+ 請假請用「其他」並寫備註';if(tm(o.b)<=tm(o.a))return '請假結束要晚於請假開始'}
  return '';

function calc(){
  const t=effTy(),o=readForm(),sh=shiftOf(o.shift)||{},np=sh.type==='N+',el=$('c');let h='';

  el.innerHTML=h;el.style.display=h?'':'none';
}

  return `<details class="ec"><summary>${esc(e.date.slice(5))}　${e.ty}　${d.h}</summary>${d.r.map(x=>x+'<br>').join('')}${e.note?'備註：'+esc(e.note)+'<br>':''}${adm?'登記人：'+esc(e.by)+'<br>':''}${done}${ed}${btn}</details>`;
}
function pendRow9(e){

}

/* ---- 一般人員頁面 ---- */

/* ---- 後台 ---- */
$('fp9').onchange=$('ft9').onchange=()=>renderBack90();
async function loadBack90(){
  showM('bm9');
  $('fp9').innerHTML='<option value="">全部</option>'+staff9().map(n=>`<option>${esc(n)}</option>`).join('');
  try{S.bv9=await call('view90',{month:S.month});renderBack90()}catch(e){msg(e.message)}
  ['dTrash9','dEdits9'].forEach(id=>{if($(id).open)loadExtra9(id)});
}
function renderBack90(){
  const v=S.bv9;if(!v)return;
  $('pend9').innerHTML=v.pending.map(pendRow9).join('')||'<p class="note" style="margin:0">目前沒有待處理的項目</p>';
  $('bStat9').innerHTML='<tr><th>姓名</th><th>上月未休分鐘</th><th>本月總加班分鐘</th><th>本月多出分鐘</th><th>未休分鐘（含上月）</th><th>可換算</th><th>本月抵消（h）</th><th>結轉下月</th><th>本月小時假</th></tr>'+
    v.stats.slice().sort((p,q)=>by9(p.name,q.name)).map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" min="0" step="1" class="${s.manualIn?'':'auto'}" value="${s.carryIn}" data-n="${esc(s.name)}" data-f="in"></td><td>${s.total}</td><td>${s.extra}</td><td><b>${s.unused}</b></td><td>${s.can} h</td><td><input type="number" min="0" step="0.5" class="${s.manualOff?'':'auto'}" value="${s.offset}" data-n="${esc(s.name)}" data-f="off"></td><td><b>${s.carryOut} 分</b></td><td>${s.lv?hm(s.lv):''}</td></tr>`).join('');
  $('bDays9').innerHTML='<tr><th>日期</th><th>姓名</th><th>加班分鐘</th><th>計入工時</th><th>多出分鐘</th><th>小時假</th></tr>'+(v.days.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.name)}</td><td>${d.t||''}</td><td>${d.t?d.counted+' h':''}</td><td>${d.extra?'<span class="warn">'+d.extra+' 分</span>':''}</td><td>${d.lv?hm(d.lv):''}</td></tr>`).join('')||'<tr><td colspan="6" class="note">本月沒有加班或小時假</td></tr>');
  const p=$('fp9').value,ty=$('ft9').value,list=v.entries.filter(e=>(!p||e.a===p||e.b===p)&&(!ty||e.ty===ty));
  $('fcnt9').textContent='共 '+list.length+' 筆';$('bList9').innerHTML=list.map(e=>card9(e,true)).join('')||'<p class="note">沒有符合的登記</p>';
}
$('bStat9').onchange=async e=>{const i=e.target.closest('input');if(!i)return;
  const n=i.dataset.n,row=[...$('bStat9').querySelectorAll('input')].filter(x=>x.dataset.n===n),cin=row.find(x=>x.dataset.f==='in'),off=row.find(x=>x.dataset.f==='off');
  const manualIn=!cin.classList.contains('auto')||i===cin,manualOff=!off.classList.contains('auto')||i===off;
  try{await call('setMonth90',{month:S.month,name:n,carryIn:manualIn&&cin.value!==''?cin.value:'',offset:manualOff&&off.value!==''?off.value:''});toast('已儲存')}catch(err){msg(err.message)}
  loadBack90();
};
async function loadExtra9(id){
  try{
    if(id==='dTrash9'){const r=await call('trash90');
      $('bTrash9').innerHTML='<tr><th>刪除時間</th><th>刪除者</th><th>日期</th><th>內容</th><th></th></tr>'+(r.rows.map(x=>{const e={ty:x[3],date:x[4],a:x[5],sa:x[6],b:x[7],sb:x[8],kind:x[9],t1:x[10],t2:x[11]},d=desc9(e);
        return `<tr><td>${esc(x[16])}</td><td>${esc(x[17])}</td><td>${esc(x[4])}</td><td>${esc(x[3])}　${d.h}${x[12]?'　備註：'+esc(x[12]):''}</td><td><button type="button" class="x" style="border:1px solid var(--bd)" data-a9="restore" data-id="${esc(x[0])}">還原</button></td></tr>`}).join('')||'<tr><td colspan="5" class="note">目前沒有已刪除的資料</td></tr>')}
    else{const r=await call('logs');
      $('bEdits9').innerHTML='<tr><th>時間</th><th>修改者</th><th>動作</th><th>對象</th><th>修改前</th><th>修改後</th></tr>'+(r.edits.filter(isD90).map(x=>'<tr>'+x.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="6" class="note">目前沒有修改紀錄</td></tr>')}
  }catch(e){msg(e.message)}
}
['dTrash9','dEdits9'].forEach(id=>$(id).addEventListener('toggle',()=>{if($(id).open)loadExtra9(id)}));

/* ---- 已處理／編輯／刪除／還原 ---- */
let EID9=null;
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a9]');if(!b)return;const id=b.dataset.id,act=b.dataset.a9;
  try{
    if(act==='done'||act==='undone'){await call('done90',{id:id,undo:act==='undone'});toast(act==='done'?'已處理':'已取消');loadBack90();return}
    if(act==='restore'){await call('restore90',{id:id});toast('已還原');loadBack90();return}
    const e=(S.bv9.entries.find(x=>x.id===id))||(S.bv9.pending.find(x=>x.id===id));if(!e)return;
    if(act==='del'){const d=desc9(e);
      if(!await ask('確定要刪除這筆資料嗎？',esc(e.date)+'　'+e.ty+'<br>'+d.h+(d.r.length?'<br>'+d.r.join('<br>'):'')+(e.note?'<br>備註：'+esc(e.note):''),'確定刪除',true))return;
      await call('del90',{id:id});toast('已刪除');loadBack90();
    }else if(act==='edit'){
      EID9=id;$('e9body').innerHTML=form9('e9');fill9('e9');wire9('e9');
      $('einfo9').textContent='登記人：'+e.by;$('e9ty').value=e.ty;$('e9ty').disabled=true;$('e9d').value=e.date;
      ST9.e9.lk=e.ty==='請假'?e.kind:'';ST9.e9.ok=e.ty==='加班'?e.kind:'延後下班';
      if(e.ty==='換班'){$('e9swa').value=e.a;$('e9sws').value=e.sa;$('e9swb').value=e.b;$('e9swbs').value=e.sb}
      else{$('e9pa').value=e.a;$('e9psh').value=e.sa;if(e.b)$('e9cv').value=e.b}
      on9('e9',true);$('e9x1').value=e.t1||'';$('e9x2').value=e.t2||'';$('e9nt').value=e.note||'';calc9('e9');
      $('em9').style.display='flex';
    }
  }catch(err){msg(err.message)}
});
$('ecancel9').onclick=()=>{$('em9').style.display='none';EID9=null};
$('esave9').onclick=async()=>{
  const o=read9('e9'),er=chk9(o);if(er){msg(er);return}
  try{const r=await raw('edit90',Object.assign({id:EID9},o));if(!r||r.ok===false)throw new Error((r&&r.error)||'儲存失敗');
    $('em9').style.display='none';EID9=null;toast('已儲存');loadBack90()}catch(err){msg(err.message)}
};

/* ---- 匯出 Excel（D2690） ---- */
$('xgo9').onclick=async()=>{
  const btn=$('xgo9');btn.disabled=true;btn.textContent='準備中…';
  try{
    const [r]=await Promise.all([call('export90'),loadXlsx()]);
    const ym=S.month,all=$('xr9').value==='all',inM=s=>all||String(s).slice(0,7)===ym;
    const ec=n=>{const s=shift9(n);return s?s.ecode:''};
    const E=r.entries.filter(x=>inM(x[4])).map(x=>({id:x[0],at:x[1],by:x[2],ty:x[3],date:x[4],a:x[5],sa:x[6],b:x[7],sb:x[8],kind:x[9],t1:x[10],t2:x[11],note:x[12],edited:x[13],doneBy:x[14],doneAt:x[15]})).sort((p,q)=>p.date<q.date?-1:p.date>q.date?1:(p.at<q.at?-1:1));
    const chg=[['日期','人員','新班別（紙本）','電子班表代號','原因','備註']];
    E.forEach(e=>{
      if(e.ty==='換班'){chg.push([e.date,e.a,e.sb,ec(e.sb),'換班：與 '+e.b+' 互換（原 '+e.sa+'）',e.note]);chg.push([e.date,e.b,e.sa,ec(e.sa),'換班：與 '+e.a+' 互換（原 '+e.sb+'）',e.note])}
      else if(e.ty==='請假'&&e.b)chg.push([e.date,e.b,e.sb,ec(e.sb),'貼班：'+e.a+' 請 PM',e.note])});
    const lv=[['日期','人員','班別','種類','開始','結束','小時','備註']].concat(E.filter(e=>e.ty==='請假').map(e=>[e.date,e.a,e.sa,KIND9[e.kind],e.t1,e.t2,e.kind==='LV'?Math.round((tm(e.t2)-tm(e.t1))/6)/10:'',e.note]));
    const ot=[['日期','人員','班別','種類','原時間','實際時間','加班分鐘','備註']].concat(E.filter(e=>e.ty==='加班').map(e=>[e.date,e.a,e.sa,e.kind,e.t1,e.t2,min9(e),e.note]));
    const ents=[['日期','類型','人員／原上班者','班別','新上班者／貼班','新上班者原班別／貼班班別','種類','開始／原時間','結束／實際時間','備註','登記人','登記時間','已修改','已處理','處理人','處理時間']].concat(E.map(e=>[e.date,e.ty,e.a,e.sa,e.b,e.sb,e.kind,e.t1,e.t2,e.note,e.by,e.at,e.edited==='Y'?'是':'',e.doneAt?'是':'',e.doneBy,e.doneAt]));
    const stat=[['年月','姓名','上月未休分鐘','本月總加班分鐘','本月多出分鐘','未休分鐘(含上月)','可換算(h)','本月抵消(h)','結轉下月(分)']].concat(r.stats.filter(s=>inM(s.ym)).sort((p,q)=>p.ym<q.ym?-1:p.ym>q.ym?1:by9(p.name,q.name)).map(s=>[s.ym,s.name,s.carryIn,s.total,s.extra,s.unused,s.can,s.offset,s.carryOut]));
    const del=[['刪除時間','刪除者','日期','類型','人員','班別','新上班者／貼班','種類','開始','結束','備註']].concat(r.deleted.filter(x=>inM(x[4])).map(x=>[x[16],x[17],x[4],x[3],x[5],x[6],x[7],x[9],x[10],x[11],x[12]]));
    const edt=[['時間','修改者','動作','對象','修改前','修改後']].concat(r.edits.filter(e=>inM(e[0])));
    const wb=XLSX.utils.book_new();
    [['班表變動',chg],['請假',lv],['加班',ot],['所有登記',ents],['每人彙總',stat],['已刪除',del],['修改紀錄',edt]].forEach(([n,rows])=>{
      const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map((_,i)=>({wch:Math.min(40,Math.max(8,...rows.slice(0,60).map(x=>String(x[i]==null?'':x[i]).length*1.6)))}));
      XLSX.utils.book_append_sheet(wb,ws,n)});
    XLSX.writeFile(wb,'D2690調班表_'+(all?'全部':ym)+'.xlsx');
    toast('已下載');
  }catch(e){msg(e.message)}
  btn.disabled=false;btn.textContent='下載 Excel';
};

armIdle();boot();
